{% extends "base.html" %}

<div class="container">
    <h2>通知一覧</h2>
    <ul class="notification-list">
        {% for notification in notifications %}
            <li class="notification-item {% if not notification.is_read %}unread{% endif %}">
                <p>{{ notification.message }}</p>
                <small>{{ notification.created_at }}</small>
            </li>
        {% else %}
            <li>通知はありません。</li>
        {% endfor %}
    </ul>
</div>
