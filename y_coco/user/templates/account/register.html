{% extends "base.html" %}
{% from "y_coco/templates/_macros.html" import csrf %}
{% block title %}新規登録 | y-coco{% endblock %}
{% block content %}
<form method="post" class="form-card">
  {{ csrf() }}
  <label for="username">ユーザーネーム</label>
  <input id="username" name="username" type="text" maxlength="10" required
         placeholder="ユーザーネームを入力…" autocomplete="username">
  <label for="password">パスワード</label>
  <input id="password" name="password" type="password" maxlength="64" required
         placeholder="パスワードを入力…" autocomplete="new-password">
  <label for="repassword">パスワード再入力</label>
  <input id="repassword" name="repassword" type="password" maxlength="64" required
         placeholder="パスワードをもう一度入力…" autocomplete="new-password">
  <button type="submit" class="btn">登録</button>
</form>
<p class="right-align" style="margin-top:18px"><a href="{{ url_for('login.login') }}"><u>ログインはこちら</u></a></p>
{% endblock %}
