{% include 'header.html' %}

<div class="container">
    <h2>マイアカウント</h2>
    <div class="profile-card">
        <h3>ユーザー名: {{ user.username }}</h3>
        <p><a href="{{ url_for('user.prof_edit') }}">プロフィール編集</a> | <a href="{{ url_for('user.pass_change') }}">パスワード変更</a></p>
    </div>

    <h3>自分の投稿</h3>
    <div class="post-list">
        {% for post in posts %}
            <div class="post-card">
                <h4>{{ post.title }}</h4>
                <p>{{ post.summary }}</p>
                <small>投稿者: {{ user.username }}</small>
            </div>
        {% else %}
            <p>投稿はまだありません。</p>
        {% endfor %}
    </div>
</div>

{% include 'footer.html' %}
