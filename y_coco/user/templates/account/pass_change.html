{% include 'header.html' %}

<div class="container">
    <h2>パスワードの変更</h2>
    <form action="{{ url_for('user.pass_change') }}" method="POST">
        <div class="form-group">
            <label for="current_password">現在のパスワード</label>
            <input type="password" id="current_password" name="current_password" placeholder="パスワードを入力…" required>
        </div>
        <div class="form-group">
            <label for="new_password">新しいパスワード</label>
            <input type="password" id="new_password" name="new_password" placeholder="パスワードを入力…" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">パスワード再入力</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="パスワードをもう一度入力…" required>
        </div>
        <button type="submit" class="btn">完了</button>
    </form>
</div>

{% include 'footer.html' %}
