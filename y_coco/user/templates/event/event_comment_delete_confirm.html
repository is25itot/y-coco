{% include 'header.html' %}

<div class="container">
    <h2>コメントの削除確認</h2>
    <p>以下のコメントを削除しますか？</p>
    <blockquote class="comment-preview">{{ comment.body }}</blockquote>

    <form action="{{ url_for('user.event_comment_delete', comment_id=comment.id) }}" method="POST">
        <button type="submit" class="btn danger">削除</button>
        <a href="{{ url_for('user.event_detail_organizer', id=comment.event_id) }}" class="btn">キャンセル</a>
    </form>
</div>
