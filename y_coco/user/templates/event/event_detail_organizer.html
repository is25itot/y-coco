{% extends "base.html" %}

<div class="container">
    <h2>{{ event.title }}（主催者管理）</h2>
    <div class="organizer-menu">
        <a href="{{ url_for('user.event_edit', id=event.id) }}" class="btn">編集</a>
        <a href="{{ url_for('user.event_delete_confirm', id=event.id) }}" class="btn danger">削除</a>
    </div>

    <div class="event-details">
        <p><strong>日時:</strong> {{ event.event_date }}</p>
        <p><strong>場所:</strong> {{ event.location }}</p>
        <p>{{ event.description }}</p>
    </div>

    <section class="comments-section">
        <h3>コメント管理</h3>
        {% for comment in comments %}
            <div class="comment-item">
                <p><strong>{{ comment.user_name }}</strong>: {{ comment.body }}</p>
                <a href="{{ url_for('user.event_comment_delete_confirm', comment_id=comment.id) }}" class="btn-sm danger">コメント削除</a>
            </div>
        {% endfor %}
    </section>
</div>
