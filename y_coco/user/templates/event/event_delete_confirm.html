{% extends "base.html" %}

<div class="container">
    <h2>イベントの削除確認</h2>
    <p>本当にイベント「<strong>{{ event.title }}</strong>」を削除してもよろしいですか？</p>

    <form action="{{ url_for('user.event_delete', id=event.id) }}" method="POST">
        <button type="submit" class="btn danger">削除実行</button>
        <a href="{{ url_for('user.event_detail_organizer', id=event.id) }}" class="btn">キャンセル</a>
    </form>
</div>
