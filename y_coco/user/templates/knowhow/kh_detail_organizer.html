{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>{{ knowhow.title }}（投稿者用管理画面）</h2>
    <div class="organizer-menu">
        <a href="{{ url_for('user.kh_delete_confirm', id=knowhow.id) }}" class="btn danger">削除</a>
    </div>

    <div class="kh-content">
        {{ knowhow.content }}
    </div>

    <section class="comments-section">
        <h3>コメント管理</h3>
        {% for comment in comments %}
            <div class="comment-item">
                <p><strong>{{ comment.user_name }}</strong>: {{ comment.body }}</p>
                <a href="{{ url_for('user.kh_comment_delete_confirm', comment_id=comment.id) }}" class="btn-sm danger">コメント削除</a>
            </div>
        {% endfor %}
    </section>
</div>
{% endblock %}
