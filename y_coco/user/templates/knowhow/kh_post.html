{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% set header_mode = 'back' %}
{% set back_url = url_for('kh_list.index') %}
{% block title %}ノウハウ投稿 | y-coco{% endblock %}
{% block content %}
{% if kh_er_message %}
<div class="flash error" style="white-space:pre-line">{{ kh_er_message }}</div>
{% endif %}
<form method="post" class="form-card">
  {{ csrf() }}
  <label for="title">タイトル</label>
  <input id="title" name="title" type="text" maxlength="50" required
         value="{{ form.title.data or '' }}">

  <label for="kh_post">内容</label>
  <textarea id="kh_post" name="kh_post" class="field" maxlength="500" required>{{ form.kh_post.data or '' }}</textarea>

  <button type="submit" class="btn">投稿</button>
</form>
{% endblock %}
