{# フッター(3タブ)。active_tab: 'account' | 'event' | 'knowhow'。管理者はマイアカウントがアカウント一覧になる #}
{% set cur_user = current_user if current_user.is_authenticated else none %}
<nav class="app-footer">
  <a class="{{ 'active' if active_tab == 'account' }}"
     href="{{ url_for('admin.account_list') if (cur_user and cur_user.admin_flg) else url_for('user.myaccount') }}">
    <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zm9 3.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM6.5 19c.5-3 2.8-4.5 5.5-4.5s5 1.500 5.500 4.500z" fill-rule="evenodd"/></svg>
    マイアカウント
  </a>
  <a class="{{ 'active' if active_tab == 'event' }}" href="{{ url_for('event_list.index') }}">
    <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 10h14v10H5zm8 3v5h5v-5z" fill-rule="evenodd"/></svg>
    イベント
  </a>
  <a class="{{ 'active' if active_tab == 'knowhow' }}" href="{{ url_for('kh_list.index') }}">
    <svg viewBox="0 0 24 24"><path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h7.2A6.500 6.500 0 0 1 20 11.500V8l-6-6zm7 1.500L18.500 9H13zM17.500 13a4.500 4.500 0 1 0 0 9 4.500 4.500 0 0 0 0-9z" fill-rule="evenodd"/><text x="17.500" y="20.300" font-size="7" text-anchor="middle" fill="#1f2f7a" font-weight="bold">?</text></svg>
    ノウハウ
  </a>
</nav>
