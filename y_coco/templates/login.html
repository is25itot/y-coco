{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}ログイン | y-coco{% endblock %}
{% block content %}
{% if login_flg %}
  <div class="confirm-box">
    <p>ログインしています。</p>
    <div class="btn-row">
      <a class="btn ghost" href="{{ url_for('event_list.index') }}">戻る</a>
      <a class="btn danger" href="{{ url_for('logout.logout') }}">ログアウト</a>
    </div>
  </div>
{% else %}
  <form method="post" class="form-card">
    {{ csrf() }}
    <label for="username">ユーザーネーム</label>
    <input id="username" name="username" type="text" maxlength="10" required
           placeholder="ユーザーネームを入力…" autocomplete="username" value="{{ username or '' }}">
    <label for="password">パスワード</label>
    <input id="password" name="password" type="password" maxlength="64" required
           placeholder="パスワードを入力…" autocomplete="current-password">
    <button type="submit" class="btn">ログイン</button>
  </form>
  <p class="right-align" style="margin-top:18px"><a href="{{ url_for('account.register') }}"><u>アカウントをお持ちでない方はこちら</u></a></p>
{% endif %}
{% endblock %}
