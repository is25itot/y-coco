{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>【管理者】ノウハウ検索</h2>
    <form action="{{ url_for('admin.kh_search') }}" method="GET" class="search-form">
        <input type="text" name="q" placeholder="キーワード・投稿者名を入力…" value="{{ request.args.get('q', '') }}">
        <button type="submit" class="btn">検索</button>
    </form>

    <div class="search-results">
        {% if results %}
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>タイトル</th>
                        <th>投稿者</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for kh in results %}
                        <tr>
                            <td>{{ kh.id }}</td>
                            <td><a href="{{ url_for('admin.kh_detail', kh_id=kh.id) }}">{{ kh.title }}</a></td>
                            <td>{{ kh.author_name }}</td>
                            <td>
                                <a href="{{ url_for('admin.kh_delete_confirm', kh_id=kh.id) }}" class="btn-sm danger">削除</a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>一致するノウハウが見つかりませんでした。</p>
        {% endif %}
    </div>
</div>
{% endblock %}
