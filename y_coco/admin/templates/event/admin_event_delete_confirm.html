{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>【管理者】イベント削除の確認</h2>
    <p>本当にイベント「<strong>{{ event.title }}</strong>（ID: {{ event.id }}）」を管理者権限で削除しますか？</p>

    <form action="{{ url_for('admin.event_delete', event_id=event.id) }}" method="POST">
        <button type="submit" class="btn danger">削除実行</button>
        <a href="{{ url_for('admin.event_detail', event_id=event.id) }}" class="btn">キャンセル</a>
    </form>
</div>
{% endblock %}
