{% extends "base.html" %}

<div class="container">
    <h2>【管理者】イベントコメント削除の確認</h2>
    <p>管理者権限で以下のコメントを削除しますか？</p>
    <blockquote class="comment-preview">{{ comment.body }}</blockquote>

    <form action="{{ url_for('admin.event_comment_delete', comment_id=comment.id) }}" method="POST">
        <button type="submit" class="btn danger">削除</button>
        <a href="{{ url_for('admin.event_detail', event_id=comment.event_id) }}" class="btn">キャンセル</a>
    </form>
</div>
