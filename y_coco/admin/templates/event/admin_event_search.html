{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>【管理者】イベント検索</h2>
    <form action="{{ url_for('admin.event_search') }}" method="GET" class="search-form">
        <input type="text" name="q" placeholder="キーワード・主催者名を入力…" value="{{ request.args.get('q', '') }}">
        <button type="submit" class="btn">検索</button>
    </form>

    <div class="search-results">
        {% if results %}
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>イベント名</th>
                        <th>主催者</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for event in results %}
                        <tr>
                            <td>{{ event.id }}</td>
                            <td><a href="{{ url_for('admin.event_detail', event_id=event.id) }}">{{ event.title }}</a></td>
                            <td>{{ event.organizer_name }}</td>
                            <td>
                                <a href="{{ url_for('admin.event_delete_confirm', event_id=event.id) }}" class="btn-sm danger">削除</a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>一致するイベントが見つかりませんでした。</p>
        {% endif %}
    </div>
</div>
{% endblock %}
